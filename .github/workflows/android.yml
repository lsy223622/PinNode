name: Android CI

on:
  push:
    branches:
      - main
      - "release-branch/*"
  pull_request:
    # all PRs on all branches

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    if: "!contains(github.event.head_commit.message, '[ci skip]')"

    steps:
      - name: Check out code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Check PinNode branding assets
        run: python3 scripts/sync_pinnode_logo.py --check
      - uses: actions/setup-go@0aaccfd150d50ccaeb58ebd88d36e91967a5f35b # v5.4.0
        with:
          go-version-file: "go.mod"
      - name: Switch to Java 17 # Note: 17 is pre-installed on ubuntu-latest
        uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12 # v4.7.0
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install Android SDK components
        run: make androidsdk

      # Clean should essentially be a no-op, but make sure that it works.
      - name: Clean
        run: make clean

      - name: Format check (ktfmt)
        run: make fmt-check
  
      - name: Run Go tests
        run: make go-test

      - name: Test forwarding network binding
        run: ./tool/go test -race tailscale.com/wgengine/netstack

      - name: Check Go core vulnerabilities
        run: |
          GOBIN="$RUNNER_TEMP/pinnode-tools" ./tool/go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          PATH="$(./tool/go env GOROOT)/bin:$PATH" GOOS=android GOARCH=arm64 CGO_ENABLED=0 \
            "$RUNNER_TEMP/pinnode-tools/govulncheck" -tags=tailscale_go,ts_omit_cachenetmap ./libtailscale tailscale.com/wgengine/netstack

      - name: Build APKs
        run: make pinnode-debug

      - name: Build instrumentation-test APK
        run: make pinnode-application-test.apk

      - name: Run tests
        run: make test
