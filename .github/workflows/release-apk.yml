name: Release APK

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Version tag to validate against version.properties
        required: true
        default: v0.1.0
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.release_tag || github.run_id }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 60
    env:
      PINNODE_SERVER_URL: ${{ vars.PINNODE_SERVER_URL }}
      PINNODE_SERVER_NAME: ${{ vars.PINNODE_SERVER_NAME }}
      PINNODE_SERVER_LOCKED: ${{ vars.PINNODE_SERVER_LOCKED }}

    steps:
      - name: Check out the release tag
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.release.tag_name || github.sha }}
          fetch-depth: 0

      - name: Check PinNode branding assets
        run: python3 scripts/sync_pinnode_logo.py --check

      - name: Verify the release tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: |
          set -euo pipefail
          version="$(sed -n 's/^PINNODE_VERSION_NAME=//p' version.properties)"
          test -n "$version"
          if [[ "$RELEASE_TAG" != "v$version" ]]; then
            echo "Release tag $RELEASE_TAG does not match PinNode version v$version" >&2
            exit 1
          fi

      - name: Prepare release metadata
        id: release_meta
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: |
          set -euo pipefail
          version="$(sed -n 's/^PINNODE_VERSION_NAME=//p' version.properties)"
          commit="$(git rev-parse --short=12 HEAD)"
          test "$RELEASE_TAG" = "v$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "android_asset=pinnode-android-v${version}-${commit}.apk" >> "$GITHUB_OUTPUT"
          echo "android_checksum=pinnode-android-v${version}-${commit}.apk.sha256" >> "$GITHUB_OUTPUT"
          echo "server_asset=pinnode-server-v${version}-linux-amd64-${commit}.tar.gz" >> "$GITHUB_OUTPUT"
          echo "server_checksum=pinnode-server-v${version}-linux-amd64-${commit}.tar.gz.sha256" >> "$GITHUB_OUTPUT"
          echo "licenses_asset=pinnode-v${version}-${commit}-LICENSES.md" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@0aaccfd150d50ccaeb58ebd88d36e91967a5f35b # v5.4.0
        with:
          go-version-file: go.mod

      - name: Set up Java 17
        uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12 # v4.7.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK components
        run: make androidsdk

      - name: Configure optional server defaults
        run: |
          set -euo pipefail
          server_url="${PINNODE_SERVER_URL:-}"
          server_name="${PINNODE_SERVER_NAME:-}"
          server_locked="${PINNODE_SERVER_LOCKED:-false}"
          if [[ "${GITHUB_REPOSITORY:-}" == "lsy223622/PinNode" ]]; then
            server_url=""
            server_name=""
            server_locked="false"
          fi
          if [[ "$server_locked" != "true" && "$server_locked" != "false" ]]; then
            echo "PINNODE_SERVER_LOCKED must be true or false" >&2
            exit 1
          fi
          if [[ "$server_locked" == "true" && ( -z "$server_url" || -z "$server_name" ) ]]; then
            echo "A locked build requires PINNODE_SERVER_URL and PINNODE_SERVER_NAME" >&2
            exit 1
          fi
          sdk_dir="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$HOME/Android/Sdk}}"
          {
            printf 'sdk.dir=%s\n' "$sdk_dir"
            if [[ -n "$server_url" ]]; then
              printf 'pinnode.serverUrl=%s\n' "$server_url"
            fi
            if [[ -n "$server_name" ]]; then
              printf 'pinnode.serverName=%s\n' "$server_name"
            fi
            printf 'pinnode.serverLocked=%s\n' "$server_locked"
          } > android/local.properties

      - name: Clean generated files
        run: make clean

      - name: Check Android formatting
        run: make fmt-check

      - name: Check license headers
        run: ./scripts/check_license_headers.sh .

      - name: Check license bundle
        run: python3 scripts/build_license_bundle.py --check

      - name: Run Go tests
        run: make go-test

      - name: Run server tests
        working-directory: server
        run: |
          go test ./...
          go vet ./...

      - name: Build Linux server release
        working-directory: server
        env:
          SERVER_ASSET: ${{ steps.release_meta.outputs.server_asset }}
          SERVER_CHECKSUM: ${{ steps.release_meta.outputs.server_checksum }}
        run: |
          set -euo pipefail
          mkdir -p ../release-assets ../release-staging
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -trimpath -buildvcs=false \
              -o ../release-staging/pinnode-server .
          cp ../LICENSES.md ../release-staging/LICENSES.md
          tar -C ../release-staging -czf "../release-assets/$SERVER_ASSET" \
            pinnode-server LICENSES.md
          sha256sum "../release-assets/$SERVER_ASSET" \
            > "../release-assets/$SERVER_CHECKSUM"
          test -s "../release-assets/$SERVER_ASSET"
          test -s "../release-assets/$SERVER_CHECKSUM"

      - name: Run Android unit tests
        run: make test

      - name: Build instrumentation-test APK
        run: make pinnode-application-test.apk

      - name: Restore the signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.PINNODE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          : "${KEYSTORE_BASE64:?Set PINNODE_KEYSTORE_BASE64 in the release environment}"
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/pinnode-release.jks"
          test -s "$RUNNER_TEMP/pinnode-release.jks"

      - name: Build and sign the release APK
        env:
          JKS_PATH: ${{ runner.temp }}/pinnode-release.jks
          JKS_PASSWORD: ${{ secrets.PINNODE_KEYSTORE_PASSWORD }}
          JKS_KEY_PASSWORD: ${{ secrets.PINNODE_KEY_PASSWORD }}
          JKS_ALIAS: pinnode
        run: |
          set -euo pipefail
          : "${JKS_PASSWORD:?Set PINNODE_KEYSTORE_PASSWORD in the release environment}"
          : "${JKS_KEY_PASSWORD:?Set PINNODE_KEY_PASSWORD in the release environment}"
          make release-apk

      - name: Create release checksums
        env:
          ANDROID_ASSET: ${{ steps.release_meta.outputs.android_asset }}
          ANDROID_CHECKSUM: ${{ steps.release_meta.outputs.android_checksum }}
          LICENSES_ASSET: ${{ steps.release_meta.outputs.licenses_asset }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          cp pinnode-release.apk "release-assets/$ANDROID_ASSET"
          cp LICENSES.md "release-assets/$LICENSES_ASSET"
          sha256sum "release-assets/$ANDROID_ASSET" > "release-assets/$ANDROID_CHECKSUM"
          unzip -Z1 pinnode-release.apk | grep -Fxq assets/LICENSES.md
          test -s "release-assets/$ANDROID_ASSET"
          test -s "release-assets/$ANDROID_CHECKSUM"
          test -s "release-assets/$LICENSES_ASSET"

      - name: Upload release assets
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          ANDROID_ASSET: ${{ steps.release_meta.outputs.android_asset }}
          ANDROID_CHECKSUM: ${{ steps.release_meta.outputs.android_checksum }}
          SERVER_ASSET: ${{ steps.release_meta.outputs.server_asset }}
          SERVER_CHECKSUM: ${{ steps.release_meta.outputs.server_checksum }}
          LICENSES_ASSET: ${{ steps.release_meta.outputs.licenses_asset }}
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" \
            "release-assets/$ANDROID_ASSET" \
            "release-assets/$ANDROID_CHECKSUM" \
            "release-assets/$SERVER_ASSET" \
            "release-assets/$SERVER_CHECKSUM" \
            "release-assets/$LICENSES_ASSET" \
            --clobber

      - name: Upload workflow validation artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pinnode-release-${{ inputs.release_tag }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7

      - name: Remove the temporary signing keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/pinnode-release.jks"
