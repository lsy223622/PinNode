name: Release APK

on:
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 60
    env:
      PINNODE_SERVER_URL: ${{ vars.PINNODE_SERVER_URL }}
      PINNODE_SERVER_NAME: ${{ vars.PINNODE_SERVER_NAME }}

    steps:
      - name: Check out the release tag
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@0aaccfd150d50ccaeb58ebd88d36e91967a5f35b # v5.4.0
        with:
          go-version-file: go.mod

      - name: Set up Java 17
        uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12 # v4.7.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK components
        run: make androidsdk

      - name: Configure the production server
        run: |
          set -euo pipefail
          : "${PINNODE_SERVER_URL:?Set the release environment variable PINNODE_SERVER_URL}"
          : "${PINNODE_SERVER_NAME:?Set the release environment variable PINNODE_SERVER_NAME}"
          sdk_dir="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$HOME/Android/Sdk}}"
          {
            printf 'sdk.dir=%s\n' "$sdk_dir"
            printf 'pinnode.serverUrl=%s\n' "$PINNODE_SERVER_URL"
            printf 'pinnode.serverName=%s\n' "$PINNODE_SERVER_NAME"
            printf 'pinnode.serverLocked=true\n'
          } > android/local.properties

      - name: Clean generated files
        run: make clean

      - name: Check Android formatting
        run: make fmt-check

      - name: Check license headers
        run: ./scripts/check_license_headers.sh .

      - name: Run Go tests
        run: make go-test

      - name: Run server tests
        working-directory: server
        run: |
          go test ./...
          go vet ./...

      - name: Run Android unit tests
        run: make test

      - name: Build instrumentation-test APK
        run: make pinnode-application-test.apk

      - name: Restore the signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.PINNODE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          : "${KEYSTORE_BASE64:?Set PINNODE_KEYSTORE_BASE64 in the release environment}"
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/pinnode-release.jks"
          test -s "$RUNNER_TEMP/pinnode-release.jks"

      - name: Build and sign the release APK
        env:
          JKS_PATH: ${{ runner.temp }}/pinnode-release.jks
          JKS_PASSWORD: ${{ secrets.PINNODE_KEYSTORE_PASSWORD }}
          JKS_KEY_PASSWORD: ${{ secrets.PINNODE_KEY_PASSWORD }}
          JKS_ALIAS: pinnode
        run: |
          set -euo pipefail
          : "${JKS_PASSWORD:?Set PINNODE_KEYSTORE_PASSWORD in the release environment}"
          : "${JKS_KEY_PASSWORD:?Set PINNODE_KEY_PASSWORD in the release environment}"
          make release-apk

      - name: Upload the APK and checksum to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          sha256sum pinnode-release.apk > pinnode-release.apk.sha256
          gh release upload "$RELEASE_TAG" pinnode-release.apk pinnode-release.apk.sha256 --clobber

      - name: Remove the temporary signing keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/pinnode-release.jks"
