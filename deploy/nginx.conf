# Include in nginx's http context. Replace the hostname and certificate paths.
limit_req_zone $binary_remote_addr zone=pinnode_auth:10m rate=30r/m;

server {
    listen 80;
    server_name pinnode.example;
    return 301 https://pinnode.example$request_uri;
}

server {
    listen 443 ssl;
    server_name pinnode.example;
    ssl_certificate /etc/letsencrypt/live/pinnode.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pinnode.example/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 128k;
    limit_req_status 429;

    location /v1/auth/ {
        limit_req zone=pinnode_auth burst=20 nodelay;
        proxy_pass http://127.0.0.1:6633;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:6633;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 75s;
    }
}
