buildscript {
    ext.kotlin_version = "1.9.22"
    ext.compose_version = "1.5.10"
    ext.accompanist_version = "0.34.0"

    repositories {
        google()
        mavenCentral()
        maven {
            url = uri("https://plugins.gradle.org/m2/")
        }
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        classpath "org.jetbrains.kotlin:kotlin-serialization:$kotlin_version"
        classpath("com.ncorti.ktfmt.gradle:plugin:0.17.0")
    }
}

repositories {
    google()
    mavenCentral()
    flatDir {
        dirs 'libs'
    }
}

apply plugin: 'kotlin-android'
apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.plugin.serialization'
apply plugin: 'com.ncorti.ktfmt.gradle'

android {
    def androidApiLevel = providers.gradleProperty("androidApiLevel").get().toInteger()

    ndkVersion "23.1.7779620"
    compileSdkVersion androidApiLevel
    defaultConfig {
        def pinnodeServerUrl = getLocalProperty("pinnode.serverUrl", "")
        def pinnodeServerName = getLocalProperty("pinnode.serverName", "")
        def pinnodeServerLocked = getLocalProperty("pinnode.serverLocked", "false")
        if (pinnodeServerLocked.toBoolean() && (pinnodeServerUrl.trim().isEmpty() || pinnodeServerName.trim().isEmpty())) {
            throw new GradleException("A locked PinNode build requires pinnode.serverUrl and pinnode.serverName")
        }
        applicationId "com.lsy223622.pinnode"
        minSdkVersion 33
        targetSdkVersion androidApiLevel

        def pinnodeVersionName = getPinNodeVersionName()
        versionCode computeVersionCode(pinnodeVersionName)
        versionName pinnodeVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        // This setting, which defaults to 'true', will cause Tailscale to fall
        // back to the Google DNS servers if it cannot determine what the
        // operating system's DNS configuration is.
        //
        // Set it to false either here or in your local.properties file to
        // disable this behaviour.
        buildConfigField "boolean", "USE_GOOGLE_DNS_FALLBACK", getLocalProperty("tailscale.useGoogleDnsFallback", "true")
        // A locked build shows only the configured server name in the UI. The
        // URL remains an internal BuildConfig value and is never rendered.
        buildConfigField "String", "PINNODE_SERVER_URL", buildConfigString(pinnodeServerUrl)
        buildConfigField "String", "PINNODE_SERVER_NAME", buildConfigString(pinnodeServerName)
        buildConfigField "boolean", "PINNODE_SERVER_LOCKED", pinnodeServerLocked
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lintOptions {
        warningsAsErrors true
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    kotlinOptions {
        jvmTarget = "17"
    }
    buildFeatures {
        buildConfig true
        compose true
    }
    composeOptions {
        kotlinCompilerExtensionVersion = "$compose_version"
    }
    flavorDimensions "version"
    // Keep the upstream source namespace for class and intent compatibility;
    // applicationId above is the PinNode install identity.
    namespace 'com.tailscale.ipn'

    buildTypes {
        applicationTest {
            initWith debug
            manifestPlaceholders.leanbackRequired = isTV()
        }
        debug {
            applicationIdSuffix ".debug"
            manifestPlaceholders.leanbackRequired = isTV()
        }
        release {
            manifestPlaceholders.leanbackRequired = isTV()

            minifyEnabled true

            shrinkResources true

            proguardFiles getDefaultProguardFile(
                    'proguard-android-optimize.txt'),
                    'proguard-rules.pro'
        }
    }

    testBuildType "applicationTest"

}

dependencies {
    // Android dependencies.
    implementation "androidx.core:core:1.13.1"
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation "androidx.browser:browser:1.8.0"
    implementation "androidx.security:security-crypto:1.1.0-alpha06"
    implementation "androidx.work:work-runtime:2.9.1"
    implementation "androidx.work:work-runtime-ktx:2.9.1"

    // Kotlin dependencies.
    implementation "org.jetbrains.kotlinx:kotlinx-serialization-json:1.6.3"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.8.1"
    implementation 'junit:junit:4.13.2'
    implementation 'androidx.room:room-ktx:2.6.1'
    runtimeOnly "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1"
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    implementation "org.jetbrains.kotlin:kotlin-reflect:$kotlin_version"

    // Compose dependencies.
    def composeBom = platform('androidx.compose:compose-bom:2024.09.03')
    implementation composeBom
    implementation 'androidx.compose.material3:material3:1.3.0'
    implementation 'androidx.compose.material:material-icons-core:1.7.3'
    implementation "androidx.compose.ui:ui:1.7.3"
    implementation "androidx.compose.ui:ui-tooling:1.7.3"
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.6'
    implementation 'androidx.activity:activity-compose:1.9.2'
    implementation "com.google.accompanist:accompanist-permissions:$accompanist_version"
    implementation "com.google.accompanist:accompanist-systemuicontroller:$accompanist_version"
    implementation "androidx.core:core-splashscreen:1.1.0-rc01"
    implementation "androidx.compose.animation:animation:1.7.4"

    // Navigation dependencies.
    def nav_version = "2.8.5"
    implementation "androidx.navigation:navigation-compose:$nav_version"
    implementation "androidx.navigation:navigation-ui-ktx:$nav_version"

    // Supporting libraries.
    implementation("io.coil-kt:coil-compose:2.6.0")
    implementation("com.google.zxing:core:3.5.1")
    implementation("com.patrykandpatrick.vico:compose:1.15.0")
    implementation("com.patrykandpatrick.vico:compose-m3:1.15.0")

    // Tailscale dependencies.
    implementation ':libtailscale@aar'

    // Integration Tests
    androidTestImplementation composeBom
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit-ktx:1.2.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
    androidTestImplementation 'androidx.test.uiautomator:uiautomator:2.3.0'

    // Unit Tests
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.mockito:mockito-core:5.12.0'
    testImplementation 'org.mockito:mockito-inline:5.2.0'
    testImplementation 'org.mockito.kotlin:mockito-kotlin:5.4.0'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.8.1'

    debugImplementation("androidx.compose.ui:ui-tooling")
    implementation("androidx.compose.ui:ui-tooling-preview")
}

def getLocalProperty(key, defaultValue) {
    try {
        Properties properties = new Properties()
        project.file('local.properties').withReader('UTF-8') { reader -> properties.load(reader) }
        return properties.getProperty(key) ?: defaultValue
    } catch(Throwable ignored) {
        return defaultValue
    }
}

def buildConfigString(value) {
    def escaped = value.toString().replace('\\', '\\\\').replace('"', '\\"')
    return '"' + escaped + '"'
}


def getPinNodeVersionName() {
    def versionProps = new Properties()
    versionProps.load(project.file('../version.properties').newDataInputStream())
    def versionName = versionProps.getProperty('PINNODE_VERSION_NAME')
    if (versionName == null || !(versionName ==~ /\d+\.\d+\.\d+/)) {
        throw new GradleException('PINNODE_VERSION_NAME must be a numeric major.minor.patch version')
    }
    return versionName
}

def computeVersionCode(versionName) {
    def parts = versionName.tokenize('.').collect { it as long }
    def major = parts[0]
    def minor = parts[1]
    def patch = parts[2]
    if (major > 1800 || minor > 99 || patch > 999) {
        throw new GradleException('PinNode version components exceed versionCode encoding limits')
    }
    if (major == 0 && minor == 0 && patch == 0) {
        throw new GradleException('PinNode version must be greater than 0.0.0')
    }

    // The 300,000,000 migration base keeps v0.1.0 above pre-release builds that
    // encoded wall-clock minutes. The final digit is reserved for the platform.
    def platform = isTV() ? 1 : 0
    def code = 300_000_000L + major * 1_000_000L + minor * 10_000L + patch * 10L + platform
    if (code > 2_100_000_000L) {
        throw new GradleException('PinNode versionCode exceeds the Android limit')
    }
    return code as int
}

def isTV() {
    return project.findProperty('PLATFORM')?.toString() == 'tv'
}
